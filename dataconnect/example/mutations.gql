# dataconnect/example/mutations.gql

mutation CreateUserFromGoogle($googleUid: String!, $username: String!, $email: String!, $createdAt: Timestamp!) @auth(level: NO_ACCESS) {
  user_insert(data: {
    googleUid: $googleUid
    username: $username
    email: $email
    createdAt: $createdAt
  })
}

mutation CreateTimeEntry(
  $userId: UUID!
  $startTime: Timestamp!
  $endTime: Timestamp!
  $date: Date!
  $createdAt: Timestamp!
  $description: String
  $ticketNumber: String
  $officeNumber: String
) @auth(level: USER) {
  timeEntry_insert(data: {
    user: { id: $userId }
    startTime: $startTime
    endTime: $endTime
    date: $date
    description: $description
    ticketNumber: $ticketNumber
    officeNumber: $officeNumber
    createdAt: $createdAt
  })
}

mutation UpdateTimeEntry(
  $entryId: UUID!
  $description: String
  $ticketNumber: String
  $officeNumber: String
) @auth(level: USER) {
  timeEntry_update(
    id: $entryId
    data: {
      description: $description
      ticketNumber: $ticketNumber
      officeNumber: $officeNumber
    }
  )
}

mutation DeleteTimeEntry($entryId: UUID!) @auth(level: USER) {
  timeEntry_delete(id: $entryId)
}

mutation CreateWorkLog(
  $userId: UUID!
  $workLogId: UUID!
  $name: String!
  $description: String
  $workLogDate: Timestamp!
) @auth(level: USER) @transaction {
  query @redact {
    user(key: { id: $userId })
      @check(expr: "this != null && this.googleUid == auth.uid", message: "Not authorized to create work log for this user") {
      id
      googleUid
    }
  }
  workLog_insert(data: {
    id: $workLogId
    user: { id: $userId }
    name: $name
    description: $description
    createdAt_expr: "request.time"
    workLogDate: $workLogDate
  })
  seg1: timeEntry_insert(data: {
    userId: $userId
    workLogId: $workLogId
    startTime_expr: "vars.workLogDate + duration('8h')"
