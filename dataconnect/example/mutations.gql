# dataconnect/example/mutations.gql

mutation CreateUserFromGoogle($googleUid: String!, $username: String!, $email: String!, $createdAt: Timestamp!) @auth(level: NO_ACCESS) {
  user_insert(data: {
    googleUid: $googleUid
    username: $username
    email: $email
    createdAt: $createdAt
  })
}

mutation CreateTimeEntry(
  $userId: UUID!
  $workLogId: UUID
  $startTime: Timestamp!
  $endTime: Timestamp!
  $date: Date!
  $createdAt: Timestamp!
  $description: String
  $ticketNumber: Int
) @auth(level: USER) {
  timeEntry_insert(data: {
    user: { id: $userId }
    workLogId: $workLogId
    startTime: $startTime
    endTime: $endTime
    date: $date
    description: $description
    ticketTicketNumber: $ticketNumber
    createdAt: $createdAt
  })
}

# Work log with no starter time entries — used by the parsed-upload flow in
# NewWorkLogDialog, which creates its own entries from the parsed text
# (arbitrary times/durations) instead of the fixed 15-min template CreateWorkLog
# below always seeds.
mutation CreateWorkLogOnly(
  $userId: UUID!
  $workLogId: UUID!
  $name: String!
  $description: String
  $workLogDate: Timestamp!
) @auth(level: USER) @transaction {
  query @redact {
    user(key: { id: $userId })
      @check(expr: "this != null && this.googleUid == auth.uid", message: "Not authorized to create work log for this user") {
      id
      googleUid
    }
  }
  workLog_insert(data: {
    id: $workLogId
    user: { id: $userId }
    name: $name
    description: $description
    createdAt_expr: "request.time"
    workLogDate: $workLogDate
  })
}

# Sets the entry's ticket to $ticketNumber. Call UpsertTicket first so the
# referenced Ticket row is guaranteed to exist. Uses the raw ticketTicketNumber
# FK scalar rather than a nested `ticket: { ticketNumber }` key object —
# relation fields set that way silently produce an empty SQL SET clause on
# _update (unlike _insert, where the nested form works fine).
# officeNumber is intentionally not a parameter here (or on
# UpdateTimeEntryClearTicket below) — office is now sourced from the linked
# Ticket (see Ticket.office), not edited per entry. Leaving officeNumber out
# of `data` entirely means this never touches the column, so old per-entry
# values are preserved rather than silently nulled on every ticket change.
mutation UpdateTimeEntry(
  $entryId: UUID!
  $description: String
  $ticketNumber: Int!
) @auth(level: USER) {
  timeEntry_update(
    id: $entryId
    data: {
      description: $description
      ticketTicketNumber: $ticketNumber
    }
  )
}

# Same as UpdateTimeEntry but clears the ticket (used when the Ticket column
# is emptied out). A separate mutation avoids ambiguity between "no change"
# and "clear" for the ticket relation.
mutation UpdateTimeEntryClearTicket(
  $entryId: UUID!
  $description: String
) @auth(level: USER) {
  timeEntry_update(
    id: $entryId
    data: {
      description: $description
      ticketTicketNumber: null
    }
  )
}

mutation DeleteTimeEntry($entryId: UUID!) @auth(level: USER) {
  timeEntry_delete(id: $entryId)
}

# Find-or-create a Ticket by number. ticketNumber is the table key, so this
# updates office/ticketTitle/ticketLink on conflict rather than creating a
# duplicate row. Used by the create-ticket dialog (office and ticketNumber
# are required there; ticketTitle and ticketLink are optional).
mutation UpsertTicket(
  $ticketNumber: Int!
  $office: String
  $ticketTitle: String
  $ticketLink: String
) @auth(level: USER) {
  ticket_upsert(data: {
    ticketNumber: $ticketNumber
    office: $office
    ticketTitle: $ticketTitle
    ticketLink: $ticketLink
  })
}

# Edits an existing ticket's metadata in place (edit-ticket dialog). Keyed by
# ticketNumber (Ticket's actual table key — see @table(key: "ticketNumber")
# above) rather than id, since Data Connect's generated _update takes the
# table's real key field. ticketNumber itself is intentionally not editable
# here — changing it would move the whole shared row rather than just this
# ticket's details.
mutation UpdateTicket(
  $ticketNumber: Int!
  $office: String
  $ticketTitle: String
  $ticketLink: String
) @auth(level: USER) {
  ticket_update(
    key: { ticketNumber: $ticketNumber }
    data: {
      office: $office
      ticketTitle: $ticketTitle
      ticketLink: $ticketLink
    }
  )
}

# Points the signed-in user's color scheme selection at $colorSchemeId.
# Scoped to the caller's own row via auth.uid rather than a client-supplied
# user id. Uses the raw colorSchemeId FK scalar rather than a nested
# `colorScheme: { id }` key object — see UpdateTimeEntry for why (nested form
# no-ops on _update).
mutation SelectMyColorScheme($colorSchemeId: UUID!) @auth(level: USER) {
  user_update(
    first: { where: { googleUid: { eq_expr: "auth.uid" } } }
    data: { colorSchemeId: $colorSchemeId }
  )
}

# Resets the signed-in user back to no DB color scheme (falls back to
# HeroUI's built-in default palette). Separate mutation for the same reason
# as UpdateTimeEntryClearTicket: literal `null` can't share a document with a
# variant that sets a required variable.
mutation ClearMyColorScheme @auth(level: USER) {
  user_update(
    first: { where: { googleUid: { eq_expr: "auth.uid" } } }
    data: { colorSchemeId: null }
  )
}

mutation UpdateWorkLog($workLogId: UUID!, $name: String!) @auth(level: USER) @transaction {
  query @redact {
    workLog(key: { id: $workLogId }) {
      id
      user @check(expr: "this != null && this.googleUid == auth.uid", message: "Not authorized to modify this work log") {
        googleUid
      }
    }
  }
  workLog_update(id: $workLogId, data: { name: $name })
}

mutation DeleteWorkLog($workLogId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    workLog(key: { id: $workLogId }) {
      id
      user @check(expr: "this != null && this.googleUid == auth.uid", message: "Not authorized to delete this work log") {
        googleUid
      }
    }
  }
  workLog_update(id: $workLogId, data: { isDeleted: true })
}

mutation RestoreWorkLog($workLogId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    workLog(key: { id: $workLogId }) {
      id
      user @check(expr: "this != null && this.googleUid == auth.uid", message: "Not authorized to restore this work log") {
        googleUid
      }
    }
  }
  workLog_update(id: $workLogId, data: { isDeleted: false })
}

