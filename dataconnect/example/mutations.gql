# dataconnect/example/mutations.gql

# $userTypeName defaults to "Regular" so the existing no-arg call site in
# app/api/auth/sync-user/route.ts stays source-compatible — same defaulting
# trick as the $limit/$offset params over in queries.gql. Passing it explicitly
# rather than leaning on the column default keeps the tier a new account gets
# visible here instead of buried in the schema.
mutation CreateUserFromGoogle(
  $googleUid: String!
  $username: String!
  $email: String!
  $createdAt: Timestamp!
  $userTypeName: String! = "Regular"
) @auth(level: NO_ACCESS) {
  user_insert(data: {
    googleUid: $googleUid
    username: $username
    email: $email
    userTypeName: $userTypeName
    createdAt: $createdAt
  })
}

# NO_ACCESS — deliberately not callable from the browser. A USER-level version
# of this would let any signed-in account promote itself to Admin, since the
# only thing it takes is a target user id. Invoke it from trusted server code
# via the Admin SDK (@dataconnect/admin-generated), the same way sync-user
# calls CreateUserFromGoogle.
mutation SetUserType($userId: UUID!, $userTypeName: String!) @auth(level: NO_ACCESS) {
  user_update(id: $userId, data: { userTypeName: $userTypeName })
}

mutation CreateTimeEntry(
  $userId: UUID!
  $workLogId: UUID
  $startTime: Timestamp!
  $endTime: Timestamp!
  $date: Date!
  $createdAt: Timestamp!
  $description: String
  $ticketNumber: Int
) @auth(level: USER) {
  timeEntry_insert(data: {
    user: { id: $userId }
    workLogId: $workLogId
    startTime: $startTime
    endTime: $endTime
    date: $date
    description: $description
    ticketTicketNumber: $ticketNumber
    createdAt: $createdAt
  })
}

# Work log with no starter time entries — used by the parsed-upload flow in
# NewWorkLogDialog, which creates its own entries from the parsed text
# (arbitrary times/durations) instead of the fixed 15-min template CreateWorkLog
# below always seeds.
mutation CreateWorkLogOnly(
  $userId: UUID!
  $workLogId: UUID!
  $name: String!
  $description: String
  $workLogDate: Timestamp!
) @auth(level: USER) @transaction {
  query @redact {
    user(key: { id: $userId })
      @check(expr: "this != null && this.googleUid == auth.uid", message: "Not authorized to create work log for this user") {
      id
      googleUid
    }
  }
  workLog_insert(data: {
    id: $workLogId
    user: { id: $userId }
    name: $name
    description: $description
    createdAt_expr: "request.time"
    workLogDate: $workLogDate
  })
}

# Sets the entry's ticket to $ticketNumber. Call UpsertTicket first so the
# referenced Ticket row is guaranteed to exist. Uses the raw ticketTicketNumber
# FK scalar rather than a nested `ticket: { ticketNumber }` key object —
# relation fields set that way silently produce an empty SQL SET clause on
# _update (unlike _insert, where the nested form works fine).
# officeNumber is intentionally not a parameter here (or on
# UpdateTimeEntryClearTicket below) — office is now sourced from the linked
# Ticket (see Ticket.office), not edited per entry. Leaving officeNumber out
# of `data` entirely means this never touches the column, so old per-entry
# values are preserved rather than silently nulled on every ticket change.
mutation UpdateTimeEntry(
  $entryId: UUID!
  $description: String
  $ticketNumber: Int!
) @auth(level: USER) {
  timeEntry_update(
    id: $entryId
    data: {
      description: $description
      ticketTicketNumber: $ticketNumber
    }
  )
}

# Same as UpdateTimeEntry but clears the ticket (used when the Ticket column
# is emptied out). A separate mutation avoids ambiguity between "no change"
# and "clear" for the ticket relation.
mutation UpdateTimeEntryClearTicket(
  $entryId: UUID!
  $description: String
) @auth(level: USER) {
  timeEntry_update(
    id: $entryId
    data: {
      description: $description
      ticketTicketNumber: null
    }
  )
}

mutation DeleteTimeEntry($entryId: UUID!) @auth(level: USER) {
  timeEntry_delete(id: $entryId)
}

# Find-or-create a Ticket by number. ticketNumber is the table key, so this
# updates office/ticketTitle/ticketLink on conflict rather than creating a
# duplicate row. Used by the create-ticket dialog (office and ticketNumber
# are required there; ticketTitle and ticketLink are optional).
mutation UpsertTicket(
  $ticketNumber: Int!
  $office: String
  $ticketTitle: String
  $ticketLink: String
  $color: String
) @auth(level: USER) {
  ticket_upsert(data: {
    ticketNumber: $ticketNumber
    office: $office
    ticketTitle: $ticketTitle
    ticketLink: $ticketLink
    color: $color
  })
}

# Edits an existing ticket's metadata in place (edit-ticket dialog). Keyed by
# ticketNumber (Ticket's actual table key — see @table(key: "ticketNumber")
# above) rather than id, since Data Connect's generated _update takes the
# table's real key field. ticketNumber itself is intentionally not editable
# here — changing it would move the whole shared row rather than just this
# ticket's details.
mutation UpdateTicket(
  $ticketNumber: Int!
  $office: String
  $ticketTitle: String
  $ticketLink: String
  $color: String
) @auth(level: USER) {
  ticket_update(
    key: { ticketNumber: $ticketNumber }
    data: {
      office: $office
      ticketTitle: $ticketTitle
      ticketLink: $ticketLink
      color: $color
    }
  )
}

# Points the signed-in user's color scheme selection at $colorSchemeId.
# Scoped to the caller's own row via auth.uid rather than a client-supplied
# user id. Uses the raw colorSchemeId FK scalar rather than a nested
# `colorScheme: { id }` key object — see UpdateTimeEntry for why (nested form
# no-ops on _update).
mutation SelectMyColorScheme($colorSchemeId: UUID!) @auth(level: USER) {
  user_update(
    first: { where: { googleUid: { eq_expr: "auth.uid" } } }
    data: { colorSchemeId: $colorSchemeId }
  )
}

# Resets the signed-in user back to no DB color scheme (falls back to
# HeroUI's built-in default palette). Separate mutation for the same reason
# as UpdateTimeEntryClearTicket: literal `null` can't share a document with a
# variant that sets a required variable.
mutation ClearMyColorScheme @auth(level: USER) {
  user_update(
    first: { where: { googleUid: { eq_expr: "auth.uid" } } }
    data: { colorSchemeId: null }
  )
}

# Persists the signed-in user's performance-mode preference so it follows
# them across devices instead of living only in localStorage. Mirrors
# SelectMyColorScheme above; unlike that field this one's a plain scalar,
# not a relation, so there's no FK/nested-key gotcha to work around.
mutation SelectMyPerformanceMode($performanceMode: Boolean!) @auth(level: USER) {
  user_update(
    first: { where: { googleUid: { eq_expr: "auth.uid" } } }
    data: { performanceMode: $performanceMode }
  )
}

# Percentage multiplier for AmbientBackground's intensity (see schema.gql).
mutation SelectMyBackgroundOpacity($backgroundOpacity: Int!) @auth(level: USER) {
  user_update(
    first: { where: { googleUid: { eq_expr: "auth.uid" } } }
    data: { backgroundOpacity: $backgroundOpacity }
  )
}

# $externalTicketLinkTemplate is nullable (unlike SelectMyPerformanceMode's
# required Boolean), so a single mutation covers both setting and clearing
# the template — no separate Clear variant needed like ClearMyColorScheme.
mutation SelectMyExternalTicketLinkTemplate($externalTicketLinkTemplate: String) @auth(level: USER) {
  user_update(
    first: { where: { googleUid: { eq_expr: "auth.uid" } } }
    data: { externalTicketLinkTemplate: $externalTicketLinkTemplate }
  )
}

# Card opacity and blur are edited together in the same Settings section
# (CardStyleContext debounces both into one write), so one mutation covers
# both fields rather than mirroring SelectMyBackgroundOpacity's single-field
# pattern.
mutation SelectMyCardStyle($cardOpacity: Int!, $cardBlur: Int!) @auth(level: USER) {
  user_update(
    first: { where: { googleUid: { eq_expr: "auth.uid" } } }
    data: { cardOpacity: $cardOpacity, cardBlur: $cardBlur }
  )
}

# Toggles the Card/table border outline (see globals.css). Mirrors
# SelectMyPerformanceMode — a plain instant boolean, no debounce needed.
mutation SelectMyBordersEnabled($bordersEnabled: Boolean!) @auth(level: USER) {
  user_update(
    first: { where: { googleUid: { eq_expr: "auth.uid" } } }
    data: { bordersEnabled: $bordersEnabled }
  )
}

# Toggles whether ticket colors tint the UI. Mirrors SelectMyBordersEnabled:
# an instant per-account display boolean, no debounce needed.
mutation SelectMyTicketColorsEnabled($ticketColorsEnabled: Boolean!) @auth(level: USER) {
  user_update(
    first: { where: { googleUid: { eq_expr: "auth.uid" } } }
    data: { ticketColorsEnabled: $ticketColorsEnabled }
  )
}

mutation UpdateWorkLog($workLogId: UUID!, $name: String!) @auth(level: USER) @transaction {
  query @redact {
    workLog(key: { id: $workLogId }) {
      id
      user @check(expr: "this != null && this.googleUid == auth.uid", message: "Not authorized to modify this work log") {
        googleUid
      }
    }
  }
  workLog_update(id: $workLogId, data: { name: $name })
}

mutation DeleteWorkLog($workLogId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    workLog(key: { id: $workLogId }) {
      id
      user @check(expr: "this != null && this.googleUid == auth.uid", message: "Not authorized to delete this work log") {
        googleUid
      }
    }
  }
  workLog_update(id: $workLogId, data: { isDeleted: true })
}

mutation RestoreWorkLog($workLogId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    workLog(key: { id: $workLogId }) {
      id
      user @check(expr: "this != null && this.googleUid == auth.uid", message: "Not authorized to restore this work log") {
        googleUid
      }
    }
  }
  workLog_update(id: $workLogId, data: { isDeleted: false })
}

