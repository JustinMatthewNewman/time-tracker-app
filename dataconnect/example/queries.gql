# dataconnect/example/queries.gql

query ListUsers @auth(level: NO_ACCESS) {
  users {
    id
    username
    email
    createdAt
  }
}

query GetMyUser @auth(level: USER) {
  user(first: { where: { googleUid: { eq_expr: "auth.uid" } } }) {
    id
  }
}

query ListTimeEntries($userId: UUID!) @auth(level: USER) {
  timeEntries(
    where: { user: { id: { eq: $userId } } }
    orderBy: [{ startTime: DESC }]
  ) {
    id
    user {
      id
      username
      email
    }
    startTime
    endTime
    date
    description
    ticketNumber
    officeNumber
    createdAt
  }
}

query GetTimeEntry($entryId: UUID!) @auth(level: USER) {
  timeEntry(id: $entryId) {
    id
    user {
      id
      username
      email
    }
    startTime
    endTime
    date
    description
    ticketNumber
    officeNumber
    createdAt
  }
}

query ListWorkLogs @auth(level: USER) {
  workLogs(
    where: { user: { googleUid: { eq_expr: "auth.uid" } } }
    orderBy: [{ workLogDate: DESC }]
  ) {
    id
    name
    description
    workLogDate
    createdAt
  }
}

query ListTimeEntriesByWorkLog($workLogId: UUID!) @auth(level: USER) {
  timeEntries(
    where: {
      _and: [
        { workLog: { id: { eq: $workLogId } } }
        { user: { googleUid: { eq_expr: "auth.uid" } } }
      ]
    }
    orderBy: [{ startTime: ASC }]
  ) {
    id
    startTime
    endTime
    date
    description
    ticketNumber
    officeNumber
    createdAt
  }
}

query ListMyTimeEntries @auth(level: USER) {
  timeEntries(
    where: { user: { googleUid: { eq_expr: "auth.uid" } } }
    orderBy: [{ startTime: DESC }]
  ) {
    id
    startTime
    endTime
    ticketNumber
    officeNumber
    workLog {
      id
      name
    }
  }
}

query ListTimeEntriesByDateRange($userId: UUID!, $startDate: Date!, $endDate: Date!) @auth(level: USER) {
  timeEntries(
    where: { 
      _and: [
        { user: { id: { eq: $userId } } }
        { date: { ge: $startDate } }
        { date: { le: $endDate } }
      ]
    }
    orderBy: [{ startTime: DESC }]
  ) {
    id
    user { id }
    startTime
    endTime
    date
    description
    ticketNumber
    officeNumber
    createdAt
  }
}
