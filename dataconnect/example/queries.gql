# dataconnect/example/queries.gql

query ListUsers @auth(level: NO_ACCESS) {
  users {
    id
    username
    email
    createdAt
  }
}

query GetMyUser @auth(level: USER) {
  user(first: { where: { googleUid: { eq_expr: "auth.uid" } } }) {
    id
    colorScheme {
      id
      name
    }
  }
}

# Each scheme's light + dark Theme rows come along nested, so the client can
# apply whichever variant matches the current next-themes light/dark state
# without a second round-trip.
query ListColorSchemes @auth(level: USER) {
  colorSchemes(orderBy: [{ name: ASC }]) {
    id
    name
    themes: themes_on_colorScheme {
      id
      isDark
      background
      foreground
      surface
      surfaceForeground
      overlay
      overlayForeground
      muted
      default
      defaultForeground
      accent
      accentForeground
      border
      separator
    }
  }
}

# Full ticket list backing the Ticket autocomplete field — filtering happens
# client-side (see TicketComboBox), so this returns everything rather than
# taking a search term.
query ListTickets @auth(level: USER) {
  tickets(orderBy: [{ ticketNumber: ASC }]) {
    id
    ticketNumber
    office
    ticketTitle
    ticketLink
  }
}

query ListTimeEntries($userId: UUID!) @auth(level: USER) {
  timeEntries(
    where: { user: { id: { eq: $userId } } }
    orderBy: [{ startTime: DESC }]
  ) {
    id
    user {
      id
      username
      email
    }
    startTime
    endTime
    date
    description
    ticket {
      id
      ticketNumber
      office
      ticketTitle
      ticketLink
    }
    officeNumber
    createdAt
  }
}

query GetTimeEntry($entryId: UUID!) @auth(level: USER) {
  timeEntry(id: $entryId) {
    id
    user {
      id
      username
      email
    }
    startTime
    endTime
    date
    description
    ticket {
      id
      ticketNumber
      office
      ticketTitle
      ticketLink
    }
    officeNumber
    createdAt
  }
}

query ListWorkLogs @auth(level: USER) {
  workLogs(
    where: {
      _and: [
        { user: { googleUid: { eq_expr: "auth.uid" } } }
        { _or: [{ isDeleted: { eq: false } }, { isDeleted: { isNull: true } }] }
      ]
    }
    orderBy: [{ workLogDate: DESC }]
  ) {
    id
    name
    description
    workLogDate
    createdAt
  }
}

query ListTimeEntriesByWorkLog($workLogId: UUID!) @auth(level: USER) {
  timeEntries(
    where: {
      _and: [
        { workLog: { id: { eq: $workLogId } } }
        { user: { googleUid: { eq_expr: "auth.uid" } } }
      ]
    }
    orderBy: [{ startTime: ASC }]
  ) {
    id
    startTime
    endTime
    date
    description
    ticket {
      id
      ticketNumber
      office
      ticketTitle
      ticketLink
    }
    officeNumber
    createdAt
  }
}

query ListMyTimeEntries @auth(level: USER) {
  timeEntries(
    where: { user: { googleUid: { eq_expr: "auth.uid" } } }
    orderBy: [{ startTime: DESC }]
  ) {
    id
    startTime
    endTime
    description
    ticket {
      id
      ticketNumber
      office
      ticketTitle
      ticketLink
    }
    officeNumber
    workLog {
      id
      name
    }
  }
}

query ListTimeEntriesByDateRange($userId: UUID!, $startDate: Date!, $endDate: Date!) @auth(level: USER) {
  timeEntries(
    where: { 
      _and: [
        { user: { id: { eq: $userId } } }
        { date: { ge: $startDate } }
        { date: { le: $endDate } }
      ]
    }
    orderBy: [{ startTime: DESC }]
  ) {
    id
    user { id }
    startTime
    endTime
    date
    description
    ticket {
      id
      ticketNumber
      office
      ticketTitle
      ticketLink
    }
    officeNumber
    createdAt
  }
}
