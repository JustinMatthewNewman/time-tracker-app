# dataconnect/example/queries.gql

query ListUsers @auth(level: NO_ACCESS) {
  users {
    id
    username
    email
    userType {
      id
      name
    }
    createdAt
  }
}

query GetMyUser @auth(level: USER) {
  user(first: { where: { googleUid: { eq_expr: "auth.uid" } } }) {
    id
    # Non-null in the schema, so this is always present. Read-only to the
    # client: changing it goes through SetUserType, which is NO_ACCESS.
    #
    # `features` comes along nested rather than as a second query, so the whole
    # capability set arrives with the user record every context already fetches.
    # NOTE: this drives what the UI *renders* only — it is not a security
    # boundary. Anything actually privileged must be re-checked server-side
    # (see app/api/admin/*), since a client can trivially lie about this.
    userType {
      name
      features: features_via_UserTypeFeature {
        name
      }
    }
    colorScheme {
      id
      name
    }
    performanceMode
    backgroundOpacity
    externalTicketLinkTemplate
    cardOpacity
    cardBlur
    bordersEnabled
    ticketColorsEnabled
    squareCorners
  }
}

# Each scheme's light + dark Theme rows come along nested, so the client can
# apply whichever variant matches the current next-themes light/dark state
# without a second round-trip.
query ListColorSchemes @auth(level: USER) {
  colorSchemes(orderBy: [{ name: ASC }]) {
    id
    name
    themes: themes_on_colorScheme {
      id
      isDark
      background
      foreground
      surface
      surfaceForeground
      overlay
      overlayForeground
      muted
      default
      defaultForeground
      accent
      accentForeground
      border
      separator
    }
  }
}

# Full ticket list backing the Ticket autocomplete field — filtering happens
# client-side (see TicketComboBox), so this returns everything rather than
# taking a search term. $limit/$offset default so existing no-arg call sites
# stay source-compatible; see lib/dataconnectPagination.ts for why callers
# page through this instead of trusting a single large `limit`.
query ListTickets($limit: Int = 500, $offset: Int = 0) @auth(level: USER) {
  tickets(limit: $limit, offset: $offset, orderBy: [{ ticketNumber: ASC }]) {
    id
    ticketNumber
    office
    ticketTitle
    ticketLink
    color
  }
}

# NO_ACCESS: filters on a caller-supplied $userId with nothing tying that id
# to the caller, so at USER level any signed-in account could read any other
# account's entries by passing a different UUID. Server-only (Admin SDK).
query ListTimeEntries($userId: UUID!) @auth(level: NO_ACCESS) {
  timeEntries(
    where: {
      _and: [
        { user: { id: { eq: $userId } } }
        # A soft-deleted work log keeps all of its time entries: DeleteWorkLog
        # only flips isDeleted, so RestoreWorkLog can bring the day back.
        # ListWorkLogs used to be the only query that filtered on it, so a day
        # that was logged, deleted and logged again counted twice in every
        # total while the work logs page showed it once. Entries with no work
        # log were never deleted, so they stay.
        { _or: [
            { workLog: { isDeleted: { eq: false } } }
            { workLog: { isDeleted: { isNull: true } } }
            { workLogId: { isNull: true } }
          ] }
      ]
    }
    orderBy: [{ startTime: DESC }, { id: ASC }]
  ) {
    id
    user {
      id
      username
      email
    }
    startTime
    endTime
    date
    description
    ticket {
      id
      ticketNumber
      office
      ticketTitle
      ticketLink
    }
    officeNumber
    createdAt
  }
}

query GetTimeEntry($entryId: UUID!) @auth(level: USER) {
  timeEntry(id: $entryId) {
    id
    # Bound to the owner rather than to any authenticated caller: this takes a
    # bare entry id, and the ticket page now shows entries belonging to other
    # people, so their ids reach the browser.
    user @check(expr: "this != null && this.googleUid == auth.uid", message: "Not authorized to view this time entry") {
      id
      username
      email
      # Selected because @check can only reference fields in the selection set.
      # It is the caller's own row by the time the check passes, so this
      # discloses nothing they don't already have.
      googleUid
    }
    startTime
    endTime
    date
    description
    ticket {
      id
      ticketNumber
      office
      ticketTitle
      ticketLink
    }
    officeNumber
    createdAt
  }
}

# $limit/$offset default so existing no-arg call sites stay source-compatible;
# see lib/dataconnectPagination.ts for why callers page through this instead
# of trusting a single large `limit`.
query ListWorkLogs($limit: Int = 500, $offset: Int = 0) @auth(level: USER) {
  workLogs(
    limit: $limit
    offset: $offset
    where: {
      _and: [
        { user: { googleUid: { eq_expr: "auth.uid" } } }
        { _or: [{ isDeleted: { eq: false } }, { isDeleted: { isNull: true } }] }
      ]
    }
    orderBy: [{ workLogDate: DESC }, { id: ASC }]
  ) {
    id
    name
    description
    workLogDate
    createdAt
  }
}

query ListTimeEntriesByWorkLog($workLogId: UUID!) @auth(level: USER) {
  timeEntries(
    where: {
      _and: [
        { workLog: { id: { eq: $workLogId } } }
        { user: { googleUid: { eq_expr: "auth.uid" } } }
      ]
    }
    orderBy: [{ startTime: ASC }]
  ) {
    id
    startTime
    endTime
    date
    description
    ticket {
      id
      ticketNumber
      office
      ticketTitle
      ticketLink
    }
    officeNumber
    createdAt
  }
}

# Backs the ticket breakdown page (/ticket/[ticket_number]) — every time entry
# linked to this ticket, across all of the caller's work logs. Scoped to
# user.googleUid like ListTimeEntriesByWorkLog rather than returning every
# user's entries for the ticket, since Ticket is a shared lookup row but
# TimeEntry ownership (and everything else this app shows per-entry) is
# per-user.
query ListTimeEntriesByTicket($ticketNumber: Int!) @auth(level: USER) {
  timeEntries(
    where: {
      _and: [
        { ticket: { ticketNumber: { eq: $ticketNumber } } }
        { user: { googleUid: { eq_expr: "auth.uid" } } }
        # Skip soft-deleted work logs' entries — see ListTimeEntries.
        { _or: [
            { workLog: { isDeleted: { eq: false } } }
            { workLog: { isDeleted: { isNull: true } } }
            { workLogId: { isNull: true } }
          ] }
      ]
    }
    orderBy: [{ startTime: DESC }, { id: ASC }]
  ) {
    id
    startTime
    endTime
    date
    description
    workLog {
      id
      name
    }
    createdAt
  }
}

# $limit/$offset default so existing no-arg call sites stay source-compatible;
# see lib/dataconnectPagination.ts for why callers page through this instead
# of trusting a single large `limit`.
# Every user's time on one ticket, for the ticket page's all-users view.
#
# NO_ACCESS and unreachable from a browser: this is cross-user visibility, so
# the only way in is GET /api/tickets/[ticket_number]/entries, which gates on
# the TicketAllUsers feature via requireFeature(). Same rule as
# AdminListTimeEntriesForUsers — a client-callable query taking a user id is
# what the earlier IDOR fix removed.
#
# The route deliberately does NOT pass each entry's user id through to the
# client: the username is what gets displayed, and CreateTimeEntry still trusts
# a client-supplied $userId, so handing out other people's ids would widen that.
query ListTimeEntriesForTicket(
  $ticketNumber: Int!
  $limit: Int = 500
  $offset: Int = 0
) @auth(level: NO_ACCESS) {
  timeEntries(
    limit: $limit
    offset: $offset
    where: {
      _and: [
        { ticket: { ticketNumber: { eq: $ticketNumber } } }
        # Skip soft-deleted work logs' entries — see ListTimeEntries.
        { _or: [
            { workLog: { isDeleted: { eq: false } } }
            { workLog: { isDeleted: { isNull: true } } }
            { workLogId: { isNull: true } }
          ] }
      ]
    }
    orderBy: [{ startTime: DESC }, { id: ASC }]
  ) {
    id
    user {
      id
      username
    }
    startTime
    endTime
    date
    description
    workLog {
      id
      name
    }
    createdAt
  }
}

query ListMyTimeEntries($limit: Int = 500, $offset: Int = 0) @auth(level: USER) {
  timeEntries(
    limit: $limit
    offset: $offset
    where: {
      _and: [
        { user: { googleUid: { eq_expr: "auth.uid" } } }
        # Skip soft-deleted work logs' entries — see ListTimeEntries.
        { _or: [
            { workLog: { isDeleted: { eq: false } } }
            { workLog: { isDeleted: { isNull: true } } }
            { workLogId: { isNull: true } }
          ] }
      ]
    }
    orderBy: [{ startTime: DESC }, { id: ASC }]
  ) {
    id
    startTime
    endTime
    description
    ticket {
      id
      ticketNumber
      office
      ticketTitle
      ticketLink
    }
    officeNumber
    workLog {
      id
      name
    }
  }
}

# $limit/$offset default so existing no-arg call sites stay source-compatible;
# see lib/dataconnectPagination.ts for why callers page through this instead
# of trusting a single large `limit`.
# NO_ACCESS for the same reason as ListTimeEntries: $userId is caller-supplied
# and unbound. Reached only by the Admin SDK (lib/googleCalendar/sync.ts, and
# admin aggregates behind requireFeature). Browsers use
# ListMyTimeEntriesByDateRange below, which binds the filter to auth.uid.
query ListTimeEntriesByDateRange($userId: UUID!, $startDate: Date!, $endDate: Date!, $limit: Int = 500, $offset: Int = 0) @auth(level: NO_ACCESS) {
  timeEntries(
    limit: $limit
    offset: $offset
    where: {
      _and: [
        { user: { id: { eq: $userId } } }
        { date: { ge: $startDate } }
        { date: { le: $endDate } }
        # Skip soft-deleted work logs' entries — see ListTimeEntries.
        { _or: [
            { workLog: { isDeleted: { eq: false } } }
            { workLog: { isDeleted: { isNull: true } } }
            { workLogId: { isNull: true } }
          ] }
      ]
    }
    orderBy: [{ startTime: DESC }, { id: ASC }]
  ) {
    id
    user { id }
    startTime
    endTime
    date
    description
    ticket {
      id
      ticketNumber
      office
      ticketTitle
      ticketLink
    }
    officeNumber
    createdAt
  }
}

# The available account tiers. USER-level rather than NO_ACCESS because the
# list is non-sensitive (five fixed names) and an admin UI needs it to populate
# a picker; assigning one is the privileged half, and that lives in SetUserType.
query ListUserTypes @auth(level: USER, insecureReason: "Tiers are non-sensitive public metadata") {
  userTypes(orderBy: [{ name: ASC }]) {
    id
    name
  }
}

# Server-side authorization lookup: resolves a caller's tier and granted
# features from a Firebase UID.
#
# NO_ACCESS is deliberate and load-bearing. This takes the uid as a plain
# parameter, so a USER-level version would let any signed-in user read anyone
# else's permissions. Only trusted server code that has already *verified* an
# ID token may ask this — see lib/featureAccess.ts, which is the only caller.
query GetUserAccessByGoogleUid($googleUid: String!) @auth(level: NO_ACCESS) {
  user(first: { where: { googleUid: { eq: $googleUid } } }) {
    id
    username
    email
    userType {
      name
      features: features_via_UserTypeFeature {
        name
      }
    }
  }
}

# Backs the admin dashboard's user list. NO_ACCESS for the same reason: the
# route handler in app/api/admin/users authorizes the caller first, then calls
# this with admin credentials.
query AdminListUsers @auth(level: NO_ACCESS) {
  users(orderBy: [{ createdAt: DESC }]) {
    id
    username
    email
    createdAt
    userType {
      name
    }
  }
}

# Backs the admin dashboard's "User Types" tab: every tier with the features
# granted to it. NO_ACCESS for the same reason as AdminListUsers — the route
# handler authorizes the caller, then calls this with admin credentials.
query AdminListUserTypes @auth(level: NO_ACCESS) {
  userTypes(orderBy: [{ name: ASC }]) {
    id
    name
    features: features_via_UserTypeFeature {
      name
      description
    }
  }
}

# The full feature catalogue, so the User Types tab can show which capabilities
# exist but are *not* granted to a tier — a grant list alone can't distinguish
# "no such feature" from "feature exists, tier doesn't have it".
query AdminListFeatures @auth(level: NO_ACCESS) {
  features(orderBy: [{ name: ASC }]) {
    id
    name
    description
  }
}

# Existence/identity check before an admin mutation. NO_ACCESS — called only
# from trusted server code that has already authorized the caller.
query AdminGetUser($userId: UUID!) @auth(level: NO_ACCESS) {
  user(id: $userId) {
    id
    username
    email
    userType {
      name
    }
  }
}

# Backs the admin page's Teams tab: every team with its members. NO_ACCESS —
# the route handler authorizes the caller (AdminDashboard feature) first.
query AdminListTeams @auth(level: NO_ACCESS) {
  teams(orderBy: [{ name: ASC }]) {
    id
    name
    description
    color
    weeklyTargetHours
    createdAt
    members: teamMembers_on_team {
      user {
        id
        username
        email
        userType {
          name
        }
      }
    }
  }
}

# The caller's Google Calendar authorization and sync preferences.
#
# NO_ACCESS, and load-bearing: this returns refreshTokenCipher, a live (if
# encrypted) credential. A USER-level version would put an OAuth token on the
# wire to the browser, which is precisely what storing it server-side was for.
# Only app/api/google-calendar/* reads this, and it never forwards the cipher
# to the client — see the redacted projection in lib/googleCalendar/store.ts.
#
# Looked up by the table key (userId) rather than by googleUid like
# GetUserAccessByGoogleUid, because every caller has already resolved the uid
# to a user row via getCallerAccess() before it gets here.
query GetGoogleCalendarConnection($userId: UUID!) @auth(level: NO_ACCESS) {
  googleCalendarConnection(key: { userId: $userId }) {
    calendarId
    googleEmail
    refreshTokenCipher
    scope
    mergeConsecutive
    overwriteExisting
    pruneOrphans
    markAsFree
    includeDescription
    connectedAt
    lastSyncedAt
  }
}

# The browser's date-windowed fetch. Unlike ListTimeEntriesByDateRange there is
# no $userId parameter to get wrong: the row filter is bound to auth.uid, so the
# scope is decided by the verified token rather than by what the client asks
# for. Same $limit/$offset paging contract as ListMyTimeEntries.
query ListMyTimeEntriesByDateRange(
  $startDate: Date!
  $endDate: Date!
  $limit: Int = 500
  $offset: Int = 0
) @auth(level: USER) {
  timeEntries(
    limit: $limit
    offset: $offset
    where: {
      _and: [
        { user: { googleUid: { eq_expr: "auth.uid" } } }
        { date: { ge: $startDate } }
        { date: { le: $endDate } }
        # Skip soft-deleted work logs' entries — see ListTimeEntries.
        { _or: [
            { workLog: { isDeleted: { eq: false } } }
            { workLog: { isDeleted: { isNull: true } } }
            { workLogId: { isNull: true } }
          ] }
      ]
    }
    orderBy: [{ startTime: DESC }, { id: ASC }]
  ) {
    id
    startTime
    endTime
    date
    description
    ticket {
      id
      ticketNumber
      office
      ticketTitle
      ticketLink
    }
    officeNumber
    createdAt
  }
}

# Time entries for a set of users over a date range, for the admin team
# dashboard's per-member totals.
#
# NO_ACCESS on purpose, and this is the whole reason the operation exists
# separately from anything the browser can call: it reads across users, so the
# only safe home for it is behind requireFeature() on the server. See the note
# on ListTimeEntriesByDateRange — a client-callable query taking a user id is
# exactly the shape that let any signed-in account read anyone's entries.
#
# Deliberately thin: no description, no work log. Totals need durations and an
# owner to group by, and the descriptions are the sensitive part of an entry —
# an admin counting a teammate's hours has no reason to receive the text of
# what they wrote.
# `id` is the tiebreaker, and it is load-bearing rather than tidiness. This
# query is read through fetchAllPages, and offset paging is only coherent when
# the ordering is a *total* order: ties may come back in a different order on
# each page request, which duplicates some rows across page boundaries and
# drops others entirely. Measured before this was added: 4,835 rows fetched,
# 4,784 unique — 51 duplicates and 51 silently missing, concentrated on
# whichever days straddled a boundary.
query AdminListTimeEntriesForUsers(
  $userIds: [UUID!]!
  $startDate: Date!
  $endDate: Date!
  $limit: Int = 500
  $offset: Int = 0
) @auth(level: NO_ACCESS) {
  timeEntries(
    limit: $limit
    offset: $offset
    where: {
      _and: [
        { user: { id: { in: $userIds } } }
        { date: { ge: $startDate } }
        { date: { le: $endDate } }
        # Skip soft-deleted work logs' entries — see ListTimeEntries.
        { _or: [
            { workLog: { isDeleted: { eq: false } } }
            { workLog: { isDeleted: { isNull: true } } }
            { workLogId: { isNull: true } }
          ] }
      ]
    }
    orderBy: [{ date: DESC }, { id: ASC }]
  ) {
    id
    user {
      id
    }
    startTime
    endTime
    date
    # Only the id, so the chart's day axis can link to that day's work log.
    # Still no description and no work log name: an admin counting hours has no
    # reason to receive what anyone wrote.
    workLog {
      id
    }
    ticket {
      ticketNumber
      ticketTitle
      color
      # So the day breakdown can link out with the same precedence as the rest
      # of the app: a ticket's own saved link beats the user's URL template
      # (see lib/externalTicketLink.ts). Ticket metadata, not personal data.
      ticketLink
    }
  }
}

# One team with its members. AdminListTeams already returns every team with
# rosters, but the team dashboard needs only the selected team, and pulling all
# of them to find one gets worse with every team added.
query AdminGetTeam($teamId: UUID!) @auth(level: NO_ACCESS) {
  team(id: $teamId) {
    id
    name
    description
    color
    weeklyTargetHours
    createdAt
    members: teamMembers_on_team {
      user {
        id
        username
        email
        userType {
          name
        }
      }
    }
  }
}
