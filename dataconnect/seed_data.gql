# dataconnect/seed_data.gql
# LOCAL ONLY — excluded from production deploys and client SDK generation.
# Re-run any time to reset these rows: colorScheme_upsert/nested Theme rows
# match on `id`, and these ids are fixed, so this is idempotent.
#
# Each scheme carries HeroUI's base semantic tokens (see
# @heroui/styles themes/default/variables.css) for both a light and dark
# variant. Status colors (success/warning/danger) are intentionally left to
# HeroUI's own defaults, so they aren't set here.

mutation SeedColorSchemes @transaction {
  ocean: colorScheme_upsert(data: {
    id: "00000000-0000-0000-0000-000000000010"
    name: "Ocean"
    themes_on_colorScheme: [
      {
        id: "00000000-0000-0000-0000-000000000011"
        isDark: false
        background: "#f0f9fa"
        foreground: "#0f2a2e"
        surface: "#ffffff"
        surfaceForeground: "#0f2a2e"
        overlay: "#ffffff"
        overlayForeground: "#0f2a2e"
        muted: "#5f7c80"
        default: "#e0f2f4"
        defaultForeground: "#0f2a2e"
        accent: "#0891b2"
        accentForeground: "#ffffff"
        border: "#cde8ea"
        separator: "#cde8ea"
      }
      {
