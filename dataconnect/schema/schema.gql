# The fixed set of account tiers (Admin, Guest, Regular, Elevated, Premium),
# referenced by User.userType. Keyed on `name` rather than a UUID for the same
# reason Ticket is keyed on ticketNumber: the natural key makes userType_upsert
# idempotent by name, and it keeps User's foreign key column readable
# ("Regular") instead of an opaque UUID.
#
# Deliberately names-only for now — feature gating keys off `name` in app code.
# Per-tier config columns (maxWorkLogs, canExportData, ...) can be added here
# later without touching User.
#
# WARNING — never DELETE a row from this table. Data Connect derives ON DELETE
# from nullability and gives no override, so User.userType being a required
# reference makes it ON DELETE CASCADE: dropping a tier here deletes every User
# holding it, and WorkLog.user / TimeEntry.user cascade in turn, taking those
# users' work logs and time entries with them. Add tiers; never remove one.
type UserType @table(key: "name") {
  id: UUID! @default(expr: "uuidV4()") @unique
  name: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

# A named application capability that can be granted to tiers — e.g.
# "AdminPage". Gating on a Feature row rather than on a hardcoded
# `userType.name == "Admin"` check means granting or revoking access is a data
# change, not a code change: a second tier can be handed the admin dashboard
# without touching a component, and a feature can be dark-launched by simply
# not granting it to anyone yet.
#
# Keyed on `name` for the same readability reason as UserType.
type Feature @table(key: "name") {
  id: UUID! @default(expr: "uuidV4()") @unique
  name: String!
  description: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# Cross-reference granting a Feature to a UserType. Composite key means one
# row per (tier, feature), so grants are idempotent to upsert and can't
# duplicate.
#
# Generates `userType.features_via_UserTypeFeature`, which is what GetMyUser
# reads to hand the client its whole capability set in one round trip.
#
# ON DELETE CASCADE (required refs, per Data Connect's nullability rule) is the
# behaviour you want here, unlike on User.userType: deleting a Feature should
# clean up its grants rather than strand them.
#
# Deliberately keyed to UserType, not User — permissions live on the tier.
# Per-user overrides, if ever needed, belong in a separate UserFeature xref
# rather than by blurring this one.
type UserTypeFeature @table(key: ["userType", "feature"]) {
  userType: UserType!
  feature: Feature!
  createdAt: Timestamp! @default(expr: "request.time")
}

type User @table {
  id: UUID! @default(expr: "uuidV4()")
  googleUid: String! @unique
  username: String!
  email: String
  # Every user has exactly one tier — non-null, no default tier at the GraphQL
  # level beyond the column default below.
  #
  # The FK scalar is declared explicitly (rather than letting a bare
  # `userType: UserType!` generate an implicit one) purely so it can carry
  # @default: that default is what backfills every pre-existing user to
  # "Regular" when the NOT NULL column is added.
  #
  # The default alone is NOT enough on a database that already has users —
  # Data Connect adds the column and its FK constraint in one statement, so the
  # "Regular" row must already be in user_type or the migration aborts with a
  # foreign key violation. See the two-phase rollout note on SeedUserTypes in
  # dataconnect/seed_data.gql.
  userType: UserType! @ref(fields: "userTypeName", references: "name")
  userTypeName: String! @default(value: "Regular")
  colorScheme: ColorScheme
  performanceMode: Boolean @default(expr: "false")
  # Percentage (0-100) multiplier applied on top of each page's own
  # AmbientBackground intensity prop (see components/AmbientBackground.tsx).
  backgroundOpacity: Int @default(expr: "100")
  # URL template for linking out to an external ticket tracker, e.g.
  # "https://www.some-random.link.com/ticket/{ticket_id}". The literal
  # "{ticket_id}" placeholder is substituted with the ticket's number when
  # rendering the link on the Ticket page.
  externalTicketLinkTemplate: String
  # Percentage (0-100) applied to Card backgrounds app-wide (see
  # .card--default/.card--secondary/.card--tertiary in globals.css) —
  # lower values let whatever's behind a card (AmbientBackground, page
  # background) show through.
  cardOpacity: Int @default(expr: "100")
  # Gaussian blur radius in pixels applied behind Card backgrounds
  # (backdrop-filter: blur(...)), for a frosted-glass look. 0 = no blur.
  cardBlur: Int @default(expr: "0")
  # Whether Cards and tables render their outer border (see [data-slot="card"]
  # and table/th/td rules in globals.css). Off strips just the border, not
  # the background/shadow, so cards stay visually distinct.
  bordersEnabled: Boolean @default(expr: "true")
  createdAt: Timestamp!
}

# A named group of users, surfaced on the admin page's Teams tab.
#
# Keyed on the default UUID rather than on `name` like UserType and Feature —
# and that difference is deliberate. Those two are fixed configuration whose
# names are referenced from application code, so a readable natural key is
# worth the cost of renames being data migrations. A team is user-authored
# data that people will rename casually, so its identity lives in an immutable
# id and `name` is merely unique.
type Team @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String! @unique
  description: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# Membership xref, same shape as UserTypeFeature. A user can belong to several
# teams and a team holds many users, so this is a join table rather than a
# `User.team` column — which would also have meant ALTERing an already-populated
# user table (see the ordering hazard documented on User.userTypeName).
#
# Generates `team.users_via_TeamMember` and `user.teams_via_TeamMember`.
#
# ON DELETE CASCADE on both sides (required refs) is what you want here:
# deleting a team should drop its memberships, and deleting a user should drop
# theirs, rather than stranding rows pointing at nothing.
type TeamMember @table(key: ["team", "user"]) {
  team: Team!
  user: User!
  createdAt: Timestamp! @default(expr: "request.time")
}

type WorkLog @table {
  user: User!
  name: String!
  description: String
  workLogDate: Timestamp!
  createdAt: Timestamp!
  isDeleted: Boolean @default(expr: "false")
}

type TimeEntry @table {
  user: User!
  workLog: WorkLog
  startTime: Timestamp!
  endTime: Timestamp!
  date: Date!
  description: String
  ticket: Ticket
  officeNumber: String
  createdAt: Timestamp!
}

# A named color scheme (e.g. "Ocean", "Forest") a user can pick in Settings.
# Each scheme has exactly one light and one dark Theme row (see below); the
# existing next-themes light/dark switch selects which variant applies, so
# switching dark mode re-themes using the same scheme instead of leaving it.
type ColorScheme @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String! @unique
  createdAt: Timestamp! @default(expr: "request.time")
}

# One light or dark variant of a ColorScheme. Fields mirror HeroUI's base
# semantic color tokens (@heroui/styles themes/default/variables.css) —
# hover/soft/secondary variants are all derived from these via color-mix(),
# so setting just these overrides the whole HeroUI palette consistently.
# Status colors (success/warning/danger) are deliberately left out: they
# stay constant across schemes so meaning (error vs. warning) doesn't shift.
type Theme @table @unique(fields: ["colorScheme", "isDark"]) {
  id: UUID! @default(expr: "uuidV4()")
  colorScheme: ColorScheme!
  isDark: Boolean!
  background: String!
  foreground: String!
  surface: String!
  surfaceForeground: String!
  overlay: String!
  overlayForeground: String!
  muted: String!
  default: String!
  defaultForeground: String!
  accent: String!
  accentForeground: String!
  border: String!
  separator: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Ticket metadata keyed by the human-entered ticket number (e.g. from the
# WorkLogTimeEntryCardTable "Ticket" column). ticketNumber (not id) is the
# table key so ticket_upsert can find-or-create a row for a given number.
# office lives here (not on TimeEntry) so every time entry linked to the same
# ticket shows the same office, editable in one place via the ticket dialog
# rather than per entry. Nullable at the DB level even though the create-ticket
# dialog requires it client-side, so tickets created before this field existed
# don't need a backfill.
type Ticket @table(key: "ticketNumber") {
  id: UUID! @default(expr: "uuidV4()") @unique
  ticketNumber: Int!
  office: String
  ticketTitle: String
  ticketLink: String
  createdAt: Timestamp! @default(expr: "request.time")
}
